name: Sparkwarden
options:
  bundleIdPrefix: com.dantanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Bumped by `just release` — MARKETING_VERSION is the last released semver,
    # CURRENT_PROJECT_VERSION a monotonically increasing integer build number.
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Sparkwarden:
    type: application
    platform: iOS
    sources:
      - path: Sparkwarden
    settings:
      base:
        DEVELOPMENT_TEAM: 72SPM7GVK7
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.dantanner.sparkwarden
        PRODUCT_NAME: Sparkwarden
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Sparkwarden/Info.plist
      properties:
        CFBundleDisplayName: Sparkwarden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # All orientations are allowed here; AppModel locks the table to
        # landscape at runtime for the duration of a game. iPad honors that
        # lock only for full-screen apps, so UIRequiresFullScreen stays on;
        # where iPadOS windows the app anyway, GameView still lays out from
        # its actual size.
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SparkwardenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkwardenTests
    dependencies:
      - target: Sparkwarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dantanner.sparkwarden.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sparkwarden:
    build:
      targets:
        Sparkwarden: all
        SparkwardenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SparkwardenTests
